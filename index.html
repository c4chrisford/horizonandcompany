<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horizon & Co | Cinematic Wedding Films</title>

<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=Inter:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

:root{
--gold:#8E7A5A;
--charcoal:#1a1a1a;
--light-grey:#fafaf9;
}

body{
margin:0;
font-family:'Inter',sans-serif;
background:var(--light-grey);
color:var(--charcoal);
scroll-behavior:smooth;
}

/* NAV */

nav{
position:fixed;
top:0;
width:100%;
background:white;
border-bottom:1px solid #eee;
z-index:1000;
padding:18px 0;
}

.nav-container{
max-width:1200px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 20px;
}

/* LOGO UPDATED */

.nav-logo{
font-family:'Great Vibes',cursive;
font-size:2.4rem;
text-decoration:none;
color:var(--charcoal);
}

.menu a{
text-decoration:none;
color:var(--charcoal);
margin-left:30px;
font-size:0.8rem;
letter-spacing:2px;
text-transform:uppercase;
font-weight:600;
}

/* HERO */

.hero{
position:relative;
height:100vh;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero-video{
position:absolute;
top:50%;
left:50%;
min-width:100%;
min-height:100%;
transform:translate(-50%,-50%);
object-fit:cover;
z-index:-2;
}

.hero-overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:-1;
}

.hero-content h1{
font-family:'Baskervville',serif;
font-size:4rem;
margin-bottom:20px;
line-height:1.2;
}

.hero-content p{
letter-spacing:3px;
text-transform:uppercase;
margin-bottom:35px;
}

.hero-btn{
background:white;
color:var(--charcoal);
padding:14px 30px;
text-decoration:none;
font-size:0.8rem;
letter-spacing:2px;
text-transform:uppercase;
font-weight:600;
}

.hero-btn:hover{
background:var(--gold);
color:white;
}

/* SECTIONS */

section{
padding:90px 20px;
max-width:1100px;
margin:auto;
}

.section-title{
text-align:center;
margin-bottom:50px;
}

.section-title h2{
font-family:'Baskervville',serif;
font-size:2.6rem;
margin-bottom:10px;
}

/* ABOUT */

.about-grid{
display:grid;
grid-template-columns:1.1fr 1fr;
gap:80px;
align-items:start;
}

.about-intro h2{
font-family:'Baskervville',serif;
font-size:2.4rem;
line-height:1.3;
margin-bottom:30px;
}

.about-lead{
font-size:1.1rem;
color:#444;
margin-bottom:25px;
}

.about-intro p,
.about-story p{
color:#666;
line-height:1.8;
margin-bottom:18px;
}

/* COLLECTIONS */

#collections{
padding-top:50px;
}

.packages{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:35px;
}

.card{
background:white;
padding:45px;
border:1px solid #e5e5e5;
text-align:center;
transition:0.3s;
cursor:pointer;
}

.card:hover{
transform:translateY(-6px);
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.card.active{
border:2px solid var(--gold);
}

.card h3{
font-family:'Baskervville',serif;
font-size:1.8rem;
}

.price{
color:var(--gold);
font-weight:600;
font-size:1.4rem;
}

.package-details{
margin-top:40px;
background:white;
border:1px solid #e5e5e5;
padding:40px;
display:none;
}

/* CONTACT */

.contact-flex{
display:flex;
gap:60px;
flex-wrap:wrap;
}

.contact-info{
flex:1;
line-height:1.7;
}

.contact-form{
flex:2;
}

input,textarea{
width:100%;
padding:15px;
margin-bottom:20px;
border:1px solid #ddd;
font-family:inherit;
}

.submit-btn{
background:var(--charcoal);
color:white;
border:none;
padding:15px 40px;
letter-spacing:2px;
text-transform:uppercase;
cursor:pointer;
}

.submit-btn:hover{
background:var(--gold);
}

.success-message{
display:none;
color:green;
margin-top:10px;
}

/* FOOTER */

footer{
text-align:center;
padding:60px;
background:white;
border-top:1px solid #eee;
font-size:0.85rem;
color:#777;
}

/* MOBILE */

@media(max-width:900px){

.about-grid{
grid-template-columns:1fr;
}

.hero-content h1{
font-size:2.6rem;
}

}

</style>
</head>

<body>

<nav>

<div class="nav-container">

<a href="#" class="nav-logo">H & C</a>

<div class="menu">
<a href="#about">About</a>
<a href="#collections">Collections</a>
<a href="#contact">Contact</a>
</div>

</div>

</nav>

<!-- HERO -->

<div class="hero">

<video autoplay muted loop playsinline class="hero-video">
<source src="videos/hero.m4v" type="video/mp4">
</video>

<div class="hero-overlay"></div>

<div class="hero-content">

<h1>The Moments You Lived.<br>And The Ones You Missed.</h1>
<p>Cinematic Wedding Films</p>

<a href="#collections" class="hero-btn">View Collections</a>

</div>

</div>
